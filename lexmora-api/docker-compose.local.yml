# Local Docker hot-reload: Go Air API (SQLite) + Vite WebUI (bind mounts).
# Usage: docker compose -f docker-compose.local.yml -p lexmora up -d --force-recreate
name: lexmora
services:
  api:
    image: golang:1.23-alpine
    restart: "no"
    working_dir: /app
    environment:
      PORT: "8080"
      DATABASE_PATH: /data/lexmora.db
      JWT_SECRET: change-me-lexmora-jwt
      CORS_ORIGINS: http://localhost:5180,http://127.0.0.1:5180,http://localhost:5173,http://127.0.0.1:5173
      DEFAULT_USERNAME: armin
      DEFAULT_PASSWORD: dopadopa123
      GIN_MODE: debug
      GOTOOLCHAIN: auto
    command:
      - sh
      - -c
      - apk add --no-cache git gcc musl-dev && go install github.com/air-verse/air@v1.61.7 && air -c .air.toml
    volumes:
      - .:/app
      - lexmora-gomod:/go/pkg/mod
      - lexmora-gotmp:/app/tmp
      - lexmora-sqlite-data:/data
    ports:
      - "8178:8080"

  webui:
    image: node:22-alpine
    restart: "no"
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_BASE_PATH: "/lexmora/"
      VITE_HMR_CLIENT_PORT: "80"
      WATCHPACK_POLLING: "true"
      VITE_API_PROXY_TARGET: http://api:8080
    command:
      - sh
      - -c
      - rm -rf /app/node_modules/* /app/node_modules/.[!.]* 2>/dev/null; npm install && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    volumes:
      - ../lexmora-webui:/app
      - lexmora-webui-node-modules:/app/node_modules
    ports:
      - "5180:5173"
    networks:
      - default
      - pc-armin-local
    depends_on:
      - api

volumes:
  lexmora-sqlite-data:
  lexmora-gomod:
  lexmora-gotmp:
  lexmora-webui-node-modules:

networks:
  pc-armin-local:
    external: true
