# Remote deploy settings - scripts read this file only (no CLI -- flags).
# Behind HAProxy on t3: https://lexmora.xaigrok.ir Ã¢â€ â€™ lexmora-webui:80 (t3-net).
# Leave publish_port empty so the UI is reached via HAProxy / Docker DNS, not a host bind.

stack_name: lexmora
image_tag: lexmora-webui:latest
compose_file: ../../docker-compose.yml
dockerfile: ../../Dockerfile
docker_network: t3-net
api_host: lexmora-api
api_port: "8080"
internal_port: "80"
publish_port: ""
delete_volume: "no"
delete_image: "no"
build_image_on: "local"

ssh: "ssh t3"

volume_dir: "/cloud-admin/docker/lexmora"
